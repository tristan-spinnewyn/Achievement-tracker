version: 2
updates:
  # npm ecosystem for the app dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Delay before proposing a new version: gives the community time
    # to detect a compromised package ("shai-hulud"-style attacks). Security
    # updates (Dependabot alerts) are not affected and arrive immediately.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions ecosystem for CI/CD actions (pinned by SHA)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
