name: CI & Build Windows Exe

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Compile, Test & Build Windows .exe
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Build and package Windows executable (.exe)
        run: npm run dist -- --publish never

      - name: Upload Windows Executable Artifacts (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: FFXIV-Achievement-Tracker-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Extract version from package.json
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: pkg_version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=v$version" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg_version.outputs.version }}
          name: Release ${{ steps.pkg_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

