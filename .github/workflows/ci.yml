name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Least privilege by default: each job only gets what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    # Name used as a "required status check" by main's branch protection: do not rename.
    name: Compile, Test & Build Windows .exe
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # Actions pinned by SHA (mutable tags); Dependabot updates SHA + comment.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify npm registry signatures & provenance
        run: npm audit signatures

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests with coverage thresholds (Vitest)
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = require('./coverage/coverage-summary.json').total;
              const row = (k) => '| ' + k + ' | ' + t[k].pct + ' % | ' + t[k].covered + ' / ' + t[k].total + ' |';
              console.log(['### Code coverage', '', '| Metric | % | Covered |', '|---|---|---|',
                ...['lines', 'statements', 'branches', 'functions'].map(row)].join('\n'));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      # The renderer only talks to the Tauri backend now: the Windows installer
      # is built by the Tauri job below, this checks that the front-end bundles.
      - name: Build the renderer (Tauri front-end)
        run: npm run tauri:renderer:build

  # Tauri app: Rust backend tests, coverage and the Windows installer (NSIS).
  # Not a required check of main's branch protection yet.
  tauri:
    name: Tauri spike (Rust tests & Windows build)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # rustup is preinstalled on GitHub's Windows runners.
      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable

      # Caches ~/.cargo and src-tauri/target (keyed on Cargo.lock): without it,
      # Tauri and its dependencies are recompiled from scratch on every run.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # Prebuilt binary with checksum verification, instead of compiling it (~2.5 min).
      # cargo-llvm-cov >= 0.9.2 is required: on Windows, Cargo passes long rustc
      # command lines through an @argfile, which older versions do not read, so the
      # crate is silently built without instrumentation (0% coverage).
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.2

      - name: Run Rust tests with coverage threshold (80% lines)
        run: npm run test:rust:coverage

      - name: Build Tauri installer (NSIS)
        run: npm run tauri:build

      - name: Upload Tauri installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FFXIV-Achievement-Tracker-Tauri-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    name: Supply-chain checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocks a PR that introduces a vulnerable dependency (severity ≥ high)
      # or one under a licence incompatible with an MIT distribution.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, AGPL-3.0-or-later

      # The devDependencies (react, zustand, chart.js…) are bundled into
      # the renderer: so we audit the whole tree, not just --omit=dev.
      - name: npm audit (high & critical)
        run: npm audit --audit-level=high
