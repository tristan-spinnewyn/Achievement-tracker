name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v2.0.1), must match package.json. Leave empty to use the package.json version'
        required: false
        type: string
      draft:
        description: 'Create as a draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as a prerelease'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify npm registry signatures & provenance
        run: npm audit signatures

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests with coverage thresholds (Vitest)
        run: npm run test:coverage

      # rustup is preinstalled on GitHub's Windows runners. No build cache here:
      # a release is always built from scratch.
      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run Rust tests
        run: npm run test:rust

      # package.json is the source of truth (bumped through a PR before tagging):
      # fail fast if the tag disagrees, instead of building mismatched binaries.
      - name: Check release tag matches package.json
        id: release_info
        env:
          # Explicit input, else the pushed tag, else empty (= use package.json).
          RELEASE_TAG: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: node scripts/release-version.mjs "$RELEASE_TAG"
        shell: bash

      # Built without the signing key: only the signing step below sees it.
      - name: Build the Windows installer (NSIS)
        run: npm run tauri:build

      - name: Name the installer like the Electron releases
        env:
          VERSION: ${{ steps.release_info.outputs.clean_version }}
        run: |
          mkdir dist
          installers=(src-tauri/target/release/bundle/nsis/*_x64-setup.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected one NSIS installer, found: ${installers[*]}"
            exit 1
          fi
          cp "${installers[0]}" "dist/FFXIV-Achievement-Tracker-Setup-$VERSION.exe"
        shell: bash

      # The Tauri updater only installs a release signed with this key; the
      # signature also carries the version (requireSignedVersion).
      - name: Sign the installer for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          VERSION: ${{ steps.release_info.outputs.clean_version }}
        run: npx --no-install tauri signer sign --app-version "$VERSION" "dist/FFXIV-Achievement-Tracker-Setup-$VERSION.exe"
        shell: bash

      - name: Upload the installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/*.exe.sig
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # OIDC to sign the provenance attestation (Sigstore)
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Determine tag and release name
        id: release_info
        env:
          # Explicit input, else the pushed tag, else empty (= use package.json).
          RELEASE_TAG: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: node scripts/release-version.mjs "$RELEASE_TAG"

      # latest.json: the feed the Tauri updater reads from the latest release.
      - name: Write the updater feed
        env:
          VERSION: ${{ steps.release_info.outputs.clean_version }}
        run: |
          node scripts/updater-manifest.mjs "$VERSION" \
            "dist-artifacts/FFXIV-Achievement-Tracker-Setup-$VERSION.exe.sig" \
            dist-artifacts/latest.json

      # latest.yml: the feed electron-updater reads, so the Electron apps (v2.x)
      # download this installer, which removes the Electron app (installer hook)
      # while the Tauri app copies its data.
      - name: Write the Electron update feed
        env:
          VERSION: ${{ steps.release_info.outputs.clean_version }}
        run: |
          node scripts/electron-update-feed.mjs "$VERSION" \
            "dist-artifacts/FFXIV-Achievement-Tracker-Setup-$VERSION.exe" \
            dist-artifacts/latest.yml

      # The Linux AppImage stays on v2.1.1, its last version: republishing that
      # feed tells those apps they are up to date instead of failing to find one.
      - name: Keep the Linux feed of v2.1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v2.1.1 -R "$GITHUB_REPOSITORY" -p latest-linux.yml -D dist-artifacts

      - name: Generate SHA256 checksums
        working-directory: dist-artifacts
        run: |
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed SLSA attestation (Sigstore): proves the installer comes from this
      # workflow, on this commit. Verify with: gh attestation verify <file> -R <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-artifacts/*.exe

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: Release ${{ steps.release_info.outputs.tag_name }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          make_latest: "true"
          files: |
            dist-artifacts/*.exe
            dist-artifacts/*.exe.sig
            dist-artifacts/latest.json
            dist-artifacts/latest.yml
            dist-artifacts/latest-linux.yml
            dist-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
