name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v2.0.1), must match package.json. Leave empty to use the package.json version'
        required: false
        type: string
      draft:
        description: 'Create as a draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as a prerelease'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_args: '--win'
            artifact_name: dist-windows
          - os: ubuntu-latest
            platform: linux
            build_args: '--linux'
            artifact_name: dist-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Verify npm registry signatures & provenance
        run: npm audit signatures

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests with coverage thresholds (Vitest)
        run: npm run test:coverage

      # package.json is the source of truth (bumped through a PR before tagging):
      # fail fast if the tag disagrees, instead of building mismatched binaries.
      - name: Check release tag matches package.json
        env:
          # Explicit input, else the pushed tag, else empty (= use package.json).
          RELEASE_TAG: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: node scripts/release-version.mjs "$RELEASE_TAG"
        shell: bash

      - name: Build and package executable
        run: npm run dist -- ${{ matrix.build_args }} --publish never

      - name: Upload binaries artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.AppImage
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 2

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # OIDC to sign the provenance attestation (Sigstore)
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist-artifacts
        run: |
          shopt -s nullglob
          sha256sum *.exe *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed SLSA attestation (Sigstore): proves the binaries come from this
      # workflow, on this commit. Verify with: gh attestation verify <file> -R <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-artifacts/*.exe
            dist-artifacts/*.AppImage

      - name: Determine tag and release name
        id: release_info
        env:
          # Explicit input, else the pushed tag, else empty (= use package.json).
          RELEASE_TAG: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: node scripts/release-version.mjs "$RELEASE_TAG"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: Release ${{ steps.release_info.outputs.tag_name }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          make_latest: "true"
          files: |
            dist-artifacts/*.exe
            dist-artifacts/*.AppImage
            dist-artifacts/latest*.yml
            dist-artifacts/*.blockmap
            dist-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
