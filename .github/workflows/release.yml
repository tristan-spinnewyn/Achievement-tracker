name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la release (ex: v0.1.2). Laisser vide pour utiliser la version de package.json'
        required: false
        type: string
      draft:
        description: 'Créer en tant que brouillon (draft)'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Marquer comme pré-version (prerelease)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_args: '--win'
            artifact_name: dist-windows
          - os: ubuntu-latest
            platform: linux
            build_args: '--linux'
            artifact_name: dist-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Sync package.json version with release tag
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const raw = process.env.INPUT_TAG || (process.env.REF_TYPE === 'tag' ? process.env.REF_NAME : '');
            if (raw) {
              const version = raw.replace(/^v/, '');
              console.log('Syncing package.json version to:', version);
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = version;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              if (fs.existsSync('package-lock.json')) {
                const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
                lock.version = version;
                if (lock.packages && lock.packages['']) {
                  lock.packages[''].version = version;
                }
                fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
              }
            }
          "

      - name: Build and package executable
        run: npm run dist -- ${{ matrix.build_args }} --publish never

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'branch' && github.ref_name || github.event.repository.default_branch || 'main' }}
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Determine tag and release name
        id: release_info
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            let tag = process.env.INPUT_TAG || (process.env.REF_TYPE === 'tag' ? process.env.REF_NAME : '');
            if (!tag) {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              tag = 'v' + pkg.version;
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag_name=' + tag + '\n');
            const cleanVersion = tag.replace(/^v/, '');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'clean_version=' + cleanVersion + '\n');
            console.log('Determined release tag:', tag);
            console.log('Determined clean version:', cleanVersion);
          "

      - name: Commit and push updated package.json to repository
        env:
          TARGET_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || github.event.repository.default_branch || 'main' }}
          TARGET_VERSION: ${{ steps.release_info.outputs.clean_version }}
        run: |
          node -e "
            const fs = require('fs');
            const targetVersion = process.env.TARGET_VERSION;
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.version !== targetVersion) {
              console.log('Updating package.json from', pkg.version, 'to', targetVersion);
              pkg.version = targetVersion;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              if (fs.existsSync('package-lock.json')) {
                const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
                lock.version = targetVersion;
                if (lock.packages && lock.packages['']) {
                  lock.packages[''].version = targetVersion;
                }
                fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
              }
            } else {
              console.log('package.json is already at version', targetVersion);
            }
          "
          if ! git diff --quiet package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(release): bump version to ${TARGET_VERSION} [skip ci]"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH" || echo "Warning: Failed to push version bump to $TARGET_BRANCH."
            echo "Version bump processed for $TARGET_BRANCH"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: Release ${{ steps.release_info.outputs.tag_name }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          make_latest: "true"
          files: |
            dist-artifacts/*.exe
            dist-artifacts/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
