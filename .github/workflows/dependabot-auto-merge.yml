name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  dependabot:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    # PR author (not github.actor, which can be a human pushing to the
    # Dependabot branch) + origin repository (not a fork).
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'tristan-spinnewyn/Achievement-tracker'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Major version bumps (Electron, Vite, React…) often change the
      # behaviour or the security surface: human review required.
      - name: Approve and enable auto-merge (patch / minor only)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major update for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "**Major** update (\`$DEPS\`): auto-merge disabled, release notes review and manual app testing required."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPS: ${{ steps.metadata.outputs.dependency-names }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
