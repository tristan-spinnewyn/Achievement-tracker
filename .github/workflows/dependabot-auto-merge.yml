name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  dependabot:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    # Auteur de la PR (et non github.actor, qui peut être un humain poussant sur la
    # branche Dependabot) + dépôt d'origine (pas de fork).
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'tristan-spinnewyn/Achievement-tracker'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Les montées de version majeures (Electron, Vite, React…) changent souvent le
      # comportement ou la surface de sécurité : relecture humaine obligatoire.
      - name: Approve and enable auto-merge (patch / minor only)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major update for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "Mise à jour **majeure** (\`$DEPS\`) : auto-merge désactivé, relecture des notes de version et test manuel de l'application requis."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPS: ${{ steps.metadata.outputs.dependency-names }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
