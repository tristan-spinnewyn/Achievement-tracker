appId: com.shin.ffxiv-achievement-tracker
productName: FFXIV Achievement Tracker
directories:
  buildResources: build
  output: release
publish:
  provider: github
  owner: tristan-spinnewyn
  repo: Achievment-tracker
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc,.prettierrc,.editorconfig,.gitignore}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js}'
asar: true
asarUnpack:
  - resources/**
extraResources:
  - from: resources
    to: resources
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: "FFXIV-Achievement-Tracker-Setup-${version}.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: "FFXIV-Achievement-Tracker-Portable-${version}.${ext}"
linux:
  target:
    - target: AppImage
      arch: [x64]
  artifactName: "FFXIV-Achievement-Tracker-${version}.${ext}"
  category: Game
  maintainer: shin
