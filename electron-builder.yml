appId: com.shin.ffxiv-achievement-tracker
productName: FFXIV Achievement Tracker
directories:
  buildResources: build
  output: release
publish:
  provider: github
  owner: tristan-spinnewyn
  repo: Achievement-tracker
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc,.prettierrc,.editorconfig,.gitignore}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js}'
asar: true
# Durcissement du binaire Electron (https://www.electronjs.org/docs/latest/tutorial/fuses)
electronFuses:
  runAsNode: false # ELECTRON_RUN_AS_NODE ignoré : l'exe ne peut pas servir d'interpréteur Node
  enableNodeOptionsEnvironmentVariable: false # NODE_OPTIONS / NODE_EXTRA_CA_CERTS ignorés
  enableNodeCliInspectArguments: false # --inspect refusé (pas d'injection via débogueur)
  enableEmbeddedAsarIntegrityValidation: true # app.asar vérifié au chargement
  onlyLoadAppFromAsar: true # pas de dossier app/ substituable à côté de l'asar
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: true # requis tant que le renderer est servi en file://
asarUnpack:
  - resources/**
extraResources:
  - from: resources
    to: resources
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: "FFXIV-Achievement-Tracker-Setup-${version}.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: "FFXIV-Achievement-Tracker-Portable-${version}.${ext}"
linux:
  target:
    - target: AppImage
      arch: [x64]
  artifactName: "FFXIV-Achievement-Tracker-${version}.${ext}"
  category: Game
  maintainer: shin
